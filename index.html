<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bayou Noir: The King in the Marsh</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #060908;
      color: #ede2c9;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #1a241f 0%, #050807 100%);
    }

    #viewport-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #3c4f44;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 12px 32px rgba(0,0,0,0.95), inset 0 0 15px rgba(0,0,0,0.85);
      overflow: hidden;
    }

    canvas#gameCanvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* HUD Superiore con Mini Mappa GTA Style */
    #hud {
      position: absolute;
      top: 5px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 20;
    }

    #hud-left {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(8, 14, 11, 0.85);
      padding: 3px 6px 3px 3px;
      border-radius: 20px;
      border: 1.5px solid #584a32;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    #minimap-canvas {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid #dfa84a;
      background: #111e17;
      image-rendering: pixelated;
      box-shadow: inset 0 0 4px #000;
    }

    #zone-info {
      display: flex;
      flex-direction: column;
    }

    #zone-title {
      font-size: 8px;
      font-weight: bold;
      color: #dfa84a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #weather-tag {
      font-size: 7px;
      color: #8da698;
    }

    #hud-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      background: rgba(8, 14, 11, 0.82);
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #3c4f44;
      font-size: 8.5px;
      color: #f1ebd8;
      text-shadow: 1px 1px 2px #000;
    }

    #autosave-indicator {
      font-size: 6.5px;
      color: #4ed982;
      font-weight: bold;
      letter-spacing: 0.5px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* Schermata Titoli / Menu Principale */
    #title-screen {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, #1a241f 0%, #070d0b 80%, #020403 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      text-align: center;
    }

    #title-logo {
      font-size: 16px;
      font-weight: 900;
      color: #f3be58;
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(243, 190, 88, 0.4), 0 3px 6px #000;
      margin-bottom: 2px;
    }

    #title-sub {
      font-size: 8.5px;
      color: #9cb1a5;
      font-style: italic;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .title-btn {
      width: 170px;
      background: #19241f;
      border: 1.5px solid #4a5c52;
      color: #e5dac2;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      padding: 8px 10px;
      margin: 4px 0;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 0 #0d1310;
      transition: all 0.15s;
    }

    .title-btn:hover, .title-btn:active {
      background: #31463b;
      border-color: #dfa84a;
      color: #fff;
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0d1310;
    }

    .title-btn:disabled {
      opacity: 0.4;
      border-color: #26332b;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Finestra di Conferma Sovrascrittura */
    #confirm-modal {
      position: absolute;
      inset: 0;
      background: rgba(3, 6, 5, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 110;
      padding: 18px;
      text-align: center;
    }

    #confirm-box {
      background: #151e1a;
      border: 2px solid #8c3b3b;
      border-radius: 6px;
      padding: 14px;
      width: 90%;
      max-width: 250px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.9);
    }

    #confirm-title {
      color: #f17a7a;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #confirm-msg {
      font-size: 9px;
      color: #d1c7b2;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .confirm-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .modal-btn {
      padding: 6px 12px;
      font-family: inherit;
      font-size: 9.5px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #444;
    }

    #btn-confirm-yes {
      background: #7a2828;
      color: #fff;
      border-color: #a83d3d;
    }

    #btn-confirm-no {
      background: #25332c;
      color: #e5dac2;
      border-color: #4b6154;
    }

    /* Finestra di Dialogo & Taccuino */
    #dialogue-box {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(11, 16, 14, 0.96);
      border: 2px solid #8c7853;
      border-radius: 4px;
      padding: 8px 10px;
      color: #f5eedc;
      font-size: 11.5px;
      line-height: 1.35;
      display: none;
      z-index: 50;
      box-shadow: 0 6px 16px rgba(0,0,0,0.9);
    }

    #dialogue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3c4b42;
      padding-bottom: 3px;
      margin-bottom: 5px;
    }

    #dialogue-speaker {
      color: #f3be58;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 10.5px;
      letter-spacing: 1px;
    }

    #dialogue-role {
      font-size: 9px;
      color: #8fa398;
      font-style: italic;
    }

    #dialogue-text {
      min-height: 36px;
      white-space: pre-line;
    }

    #dialogue-prompt {
      text-align: right;
      font-size: 8.5px;
      color: #8da496;
      animation: blink 0.9s infinite alternate;
      margin-top: 4px;
    }

    /* Menu di Pausa / START */
    #pause-menu {
      position: absolute;
      inset: 0;
      background: rgba(6, 10, 8, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 60;
      border: 2px solid #52422c;
      padding: 16px;
      backdrop-filter: blur(2px);
    }

    #pause-title {
      font-size: 13px;
      font-weight: bold;
      color: #f3be58;
      letter-spacing: 2px;
      margin-bottom: 12px;
      border-bottom: 1px solid #4a3e2a;
      padding-bottom: 4px;
      width: 75%;
      text-align: center;
    }

    .menu-item {
      width: 85%;
      max-width: 190px;
      background: #17211d;
      border: 1px solid #34483e;
      color: #e5dac2;
      font-family: inherit;
      font-size: 10.5px;
      padding: 7px 9px;
      margin: 4px 0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 4px;
      transition: background 0.15s, border-color 0.15s;
    }

    .menu-item:hover, .menu-item:active {
      background: #2b3d35;
      border-color: #dfa84a;
      color: #fff;
    }

    .menu-tag {
      font-size: 9px;
      color: #dfa84a;
      font-weight: bold;
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    /* Controlli Touch */
    #touch-controls {
      display: flex;
      width: 100%;
      max-width: 520px;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      z-index: 25;
    }

    .dpad {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .dpad-btn {
      position: absolute;
      background: #232d29;
      border: 2px solid #3b4d44;
      color: #b0c4b9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 0 #101613;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      background: #465b52;
      box-shadow: 0 1px 0 #101613;
      transform: translateY(3px);
    }

    #btn-up    { width: 38px; height: 38px; top: 0; left: 41px; }
    #btn-down  { width: 38px; height: 38px; bottom: 0; left: 41px; }
    #btn-left  { width: 38px; height: 38px; top: 41px; left: 0; }
    #btn-right { width: 38px; height: 38px; top: 41px; right: 0; }
    .dpad-center {
      position: absolute;
      width: 38px;
      height: 38px;
      top: 41px;
      left: 41px;
      background: #17201c;
      border: 1px solid #28362f;
    }

    /* Tasto START & Gruppo Sistema */
    .system-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .start-btn {
      width: 64px;
      height: 26px;
      background: #252825;
      border: 2px solid #4a524c;
      border-radius: 13px;
      color: #c9bfab;
      font-size: 9.5px;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #101311;
      font-family: inherit;
    }

    .start-btn:active, .start-btn.pressed {
      background: #3e443f;
      box-shadow: 0 1px 0 #101311;
      transform: translateY(2px);
    }

    .audio-indicator {
      font-size: 7.5px;
      color: #79877e;
      letter-spacing: 0.5px;
    }

    /* Gruppo Azione A e B */
    .action-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .right-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .act-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #3e3124;
      border: 2px solid #8e7049;
      color: #f7e8ce;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #18120b;
      cursor: pointer;
    }

    .act-btn span {
      font-size: 7px;
      color: #beaa8d;
      margin-top: 1px;
      text-transform: uppercase;
    }

    .act-btn:active, .act-btn.pressed {
      background: #624c36;
      box-shadow: 0 1px 0 #18120b;
      transform: translateY(3px);
    }

    /* ========================================================= */
    /* ORIENTAMENTO: VERTICALE (PORTRAIT) VS ORIZZONTALE (LANDSCAPE) */
    /* ========================================================= */
    @media (orientation: portrait) {
      #game-wrapper {
        flex-direction: column;
        justify-content: space-evenly;
      }
      #viewport-container {
        width: 95vw;
        height: 85.5vw;
        max-width: 380px;
        max-height: 342px;
      }
      #touch-controls {
        flex-direction: row;
        justify-content: space-around;
      }
      .right-cluster {
        flex-direction: row;
      }
    }

    @media (orientation: landscape) {
      #game-wrapper {
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        padding: 0 10px;
      }
      #viewport-container {
        height: 88vh;
        width: 97.7vh;
        max-width: 430px;
        max-height: 387px;
        order: 2;
      }
      #touch-controls {
        display: contents;
      }
      .dpad {
        order: 1;
        transform: scale(0.92);
      }
      /* IN ORIZZONTALE: START SOTTO I TASTI A E B */
      .right-cluster {
        order: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        transform: scale(0.92);
      }
      .action-group {
        order: 1;
        display: flex;
        gap: 12px;
      }
      .system-controls {
        order: 2;
        margin-top: 2px;
      }
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <div id="viewport-container">
    <!-- HUD Superiore con Mini Mappa GTA Style -->
    <div id="hud">
      <div id="hud-left">
        <canvas id="minimap-canvas" width="48" height="48"></canvas>
        <div id="zone-info">
          <span id="zone-title">SACRIFICE GLADE</span>
          <span id="weather-tag">CLEAR</span>
        </div>
      </div>
      <div id="hud-right">
        <span id="time-display">12:00</span>
        <span id="clues-counter">CLUES: 0/7</span>
        <span id="autosave-indicator">AUTO-SAVED</span>
      </div>
    </div>

    <!-- Schermo Principale di Gioco 160x144 -->
    <canvas id="gameCanvas" width="160" height="144"></canvas>

    <!-- Dialoghi e Notifiche -->
    <div id="dialogue-box">
      <div id="dialogue-header">
        <span id="dialogue-speaker">DET. HAYES</span>
        <span id="dialogue-role">State Police</span>
      </div>
      <div id="dialogue-text">...</div>
      <div id="dialogue-prompt">[Press (A) to continue]</div>
    </div>

    <!-- Schermata Titoli / Menu Principale -->
    <div id="title-screen">
      <div id="title-logo">BAYOU NOIR</div>
      <div id="title-sub">The King in the Marsh • Case File #95-04</div>
      <button class="title-btn" id="btn-title-continue">
        <span id="lbl-title-continue">CONTINUE</span>
        <span>▶</span>
      </button>
      <button class="title-btn" id="btn-title-new">
        <span id="lbl-title-new">NEW GAME</span>
        <span>★</span>
      </button>
      <button class="title-btn" id="btn-title-lang">
        <span id="lbl-title-lang">LANGUAGE</span>
        <span id="title-lang-val">ENGLISH</span>
      </button>
    </div>

    <!-- Finestra Modale Conferma Nuovo Gioco -->
    <div id="confirm-modal">
      <div id="confirm-box">
        <div id="confirm-title" id="lbl-modal-title">OVERWRITE SAVE?</div>
        <div id="confirm-msg" id="lbl-modal-msg">A saved case already exists. Starting a new game will erase your current progress. Proceed?</div>
        <div class="confirm-actions">
          <button class="modal-btn" id="btn-confirm-yes">YES, OVERWRITE</button>
          <button class="modal-btn" id="btn-confirm-no">CANCEL</button>
        </div>
      </div>
    </div>

    <!-- Menu Pausa / START -->
    <div id="pause-menu">
      <div id="pause-title">PAUSE / MENU</div>
      <button class="menu-item" id="menu-resume-btn">
        <span id="label-resume">RESUME GAME</span>
        <span class="menu-tag">▶</span>
      </button>
      <button class="menu-item" id="menu-lang-btn">
        <span id="label-language">LANGUAGE</span>
        <span class="menu-tag" id="current-lang-tag">ENGLISH</span>
      </button>
      <button class="menu-item" id="menu-music-btn">
        <span id="label-music">MUSIC</span>
        <span class="menu-tag" id="current-music-tag">ON</span>
      </button>
      <button class="menu-item" id="menu-notes-btn">
        <span id="label-journal">DETECTIVE NOTES</span>
        <span class="menu-tag">B</span>
      </button>
      <button class="menu-item" id="menu-titlescreen-btn">
        <span id="label-mainmenu">MAIN MENU</span>
        <span class="menu-tag">⏏</span>
      </button>
    </div>
  </div>

  <!-- Controlli Tattili Schermo Interattivi -->
  <div id="touch-controls">
    <!-- D-Pad -->
    <div class="dpad">
      <button class="dpad-btn" id="btn-up">▲</button>
      <button class="dpad-btn" id="btn-left">◀</button>
      <div class="dpad-center"></div>
      <button class="dpad-btn" id="btn-right">▶</button>
      <button class="dpad-btn" id="btn-down">▼</button>
    </div>

    <!-- Cluster Destro: Tasti A/B e START posizionato subito sotto in landscape -->
    <div class="right-cluster">
      <div class="action-group">
        <button class="act-btn" id="btn-inspect">
          A
          <span id="lbl-btn-a">EXAMINE</span>
        </button>
        <button class="act-btn" id="btn-log">
          B
          <span id="lbl-btn-b">NOTES</span>
        </button>
      </div>

      <div class="system-controls">
        <button class="start-btn" id="btn-start">START</button>
        <span class="audio-indicator" id="audio-tag">♪ NOIR SOUND</span>
      </div>
    </div>
  </div>
</div>

<script>
/**
 * BAYOU NOIR: THE KING IN THE MARSH
 * - Grafica pixel art vivida e ad alto contrasto di giorno
 * - Illuminazione notturna a gradazione cromatica chiara e senza oscurità profonda
 * - Mini mappa GTA Style in alto a sinistra con radar e blip
 * - Layout mobile orizzontale con START sotto i tasti A e B
 * - Sistema meteo dinamico (Pioggia & Nebbia)
 * - Schermata iniziale con Continue / New Game (conferma) e Salvataggio Automatico
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const minimapCanvas = document.getElementById('minimap-canvas');
const miniCtx = minimapCanvas.getContext('2d');
miniCtx.imageSmoothingEnabled = false;

const VIEW_W = 160;
const VIEW_H = 144;
const TILE_SIZE = 16;
const MAP_COLS = 50; // 800px
const MAP_ROWS = 40; // 640px
const WORLD_W = MAP_COLS * TILE_SIZE;
const WORLD_H = MAP_ROWS * TILE_SIZE;

// UI References
const dialogueBox = document.getElementById('dialogue-box');
const dialogueSpeaker = document.getElementById('dialogue-speaker');
const dialogueRole = document.getElementById('dialogue-role');
const dialogueText = document.getElementById('dialogue-text');
const dialoguePrompt = document.getElementById('dialogue-prompt');
const zoneTitle = document.getElementById('zone-title');
const weatherTag = document.getElementById('weather-tag');
const timeDisplay = document.getElementById('time-display');
const cluesCounter = document.getElementById('clues-counter');
const autosaveIndicator = document.getElementById('autosave-indicator');
const pauseMenu = document.getElementById('pause-menu');
const titleScreen = document.getElementById('title-screen');
const confirmModal = document.getElementById('confirm-modal');
const btnTitleContinue = document.getElementById('btn-title-continue');

// Bottoni UI Testi
const lblBtnA = document.getElementById('lbl-btn-a');
const lblBtnB = document.getElementById('lbl-btn-b');
const currentLangTag = document.getElementById('current-lang-tag');
const currentMusicTag = document.getElementById('current-music-tag');
const titleLangVal = document.getElementById('title-lang-val');
const labelResume = document.getElementById('label-resume');
const labelLanguage = document.getElementById('label-language');
const labelMusic = document.getElementById('label-music');
const labelJournal = document.getElementById('label-journal');
const labelMainMenu = document.getElementById('label-mainmenu');
const lblTitleContinue = document.getElementById('lbl-title-continue');
const lblTitleNew = document.getElementById('lbl-title-new');
const lblTitleLang = document.getElementById('lbl-title-lang');
const lblModalTitle = document.getElementById('lbl-modal-title');
const lblModalMsg = document.getElementById('lbl-modal-msg');

// -------------------------------------------------------------
// LOCALIZZAZIONE (EN di default / IT)
// -------------------------------------------------------------
let currentLang = 'en';

const I18N = {
  en: {
    btnExamine: "EXAMINE",
    btnNotes: "NOTES",
    promptContinue: "[Press (A) to continue]",
    cluesHud: "CLUES: {0}/7",
    pauseTitle: "PAUSE / MENU",
    resume: "RESUME GAME",
    language: "LANGUAGE",
    music: "MUSIC",
    journal: "DETECTIVE NOTES",
    mainMenu: "MAIN MENU",
    musicOn: "ON",
    musicOff: "OFF",
    autosave: "AUTO-SAVED",
    titleContinue: "CONTINUE",
    titleNew: "NEW GAME",
    titleLang: "LANGUAGE",
    modalTitle: "OVERWRITE SAVE?",
    modalMsg: "A saved case already exists. Starting a new game will erase your current progress. Proceed?",
    modalYes: "YES, OVERWRITE",
    modalNo: "CANCEL",
    weather: {
      clear: "CLEAR SKY",
      rain: "BAYOU RAIN",
      fog: "DENSE MIST"
    },
    zones: {
      glade: "SACRIFICE GLADE",
      church: "BLACK SPRING CHURCH",
      canal: "GHOST CANAL",
      road: "ROUTE 17 HIGHWAY",
      reeds: "DEEP CANEBRAKE"
    },
    defaultThought: {
      speaker: "DET. HAYES",
      role: "THOUGHT",
      text: "The swamp air is thick. Every road out here loops back into the mud... and the sheriff knows more than he lets on."
    },
    emptyJournal: {
      title: "HAYES' NOTEBOOK",
      sub: "CASE FILE #95-04",
      text: "No formal evidence collected yet.\nExplore the clearing south, inspect the patrol car along Route 17, and talk with the fisherman by the pier."
    },
    journalHeader: "--- CASE FILE: CLARA FONTENOT ({0}/7) ---\n\n",
    inspectDoor: "Standing outside {0}.\nThe wooden porch groans under your weight. The scent of candle wax hangs heavy."
  },

// -------------------------------------------------------------
// COLONNA SONORA PROCEDURALE (Web Audio API - True Detective Vibe)
// -------------------------------------------------------------
let audioCtx = null;
let isMusicEnabled = true;
let musicTimer = null;
let masterGain = null;

function initAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();
  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0.18, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);
  startProceduralSoundtrack();
}

function playPluckNote(freq, time, decay = 2.4) {
  if (!audioCtx || !isMusicEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, time);
  osc.frequency.linearRampToValueAtTime(freq * 0.992, time + decay);

  gain.gain.setValueAtTime(0.24, time);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + decay);

  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(time);
  osc.stop(time + decay);
}

function playSubDrone(freq, time, duration = 4.2) {
  if (!audioCtx || !isMusicEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq, time);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(150, time);

  gain.gain.setValueAtTime(0.01, time);
  gain.gain.linearRampToValueAtTime(0.14, time + 1.2);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start(time);
  osc.stop(time + duration);
}

function startProceduralSoundtrack() {
  const notes = [73.42, 110.00, 146.83, 174.61, 207.65, 220.00];
  let step = 0;

  function scheduleNext() {
    if (!isMusicEnabled) {
      musicTimer = setTimeout(scheduleNext, 2000);
      return;
    }
    const now = audioCtx.currentTime;
    if (step % 4 === 0) {
      playSubDrone(55.0, now, 5.0);
    }
    const note = notes[step % notes.length];
    playPluckNote(note, now + 0.1, 2.5);

    step++;
    const interval = 1200 + (Math.sin(step) * 300);
    musicTimer = setTimeout(scheduleNext, interval);
  }
  scheduleNext();
}

function toggleMusic() {
  isMusicEnabled = !isMusicEnabled;
  if (isMusicEnabled) {
    if (!audioCtx) initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  const t = I18N[currentLang];
  currentMusicTag.innerText = isMusicEnabled ? t.musicOn : t.musicOff;
}

// CICLO GIORNO / NOTTE (5 Minuti reali di gameplay attivo)
// -------------------------------------------------------------
const DAY_CYCLE_DURATION = 300; // 300s = esatti 5 minuti
let worldTimeSeconds = 60;

function updateDayNightCycle(deltaTime) {
  worldTimeSeconds = (worldTimeSeconds + deltaTime) % DAY_CYCLE_DURATION;
  const progress = worldTimeSeconds / DAY_CYCLE_DURATION;
  const virtualHour = Math.floor((progress * 24 + 6) % 24);
  const virtualMin = Math.floor((progress * 24 * 60) % 60);
  timeDisplay.innerText = `${String(virtualHour).padStart(2, '0')}:${String(virtualMin).padStart(2, '0')}`;
}

// Gradazioni di tono e luce chiare (senza mai oscurare la mappa)
function getDayNightAmbientColor() {
  const p = worldTimeSeconds / DAY_CYCLE_DURATION;

  // 1. Mattina (06:00 - 11:59): limpida, chiara con leggerissimo calore dorato
  if (p < 0.25) {
    return { r: 255, g: 240, b: 200, a: 0.04, blend: 'source-over' };
  }
  // 2. Pomeriggio (12:00 - 17:59): massima visibilità e brillantezza (zero scurimento)
  else if (p < 0.50) {
    return { r: 255, g: 255, b: 255, a: 0.0, blend: 'source-over' };
  }
  // 3. Tramonto (18:00 - 20:59): tono ambrato / arancione caldo atmosferico
  else if (p < 0.65) {
    const factor = (p - 0.50) / 0.15;
    return { r: 215, g: 110, b: 40, a: 0.18 * factor, blend: 'multiply' };
  }
  // 4. Sera e Notte (21:00 - 04:59): tono blu-indaco fresco lunare, MAI nero/buio pesto!
  else if (p < 0.90) {
    const factor = Math.sin(((p - 0.65) / 0.25) * Math.PI);
    return { r: 20, g: 45, b: 85, a: 0.18 + factor * 0.12, blend: 'multiply' };
  }
  // 5. Alba (05:00 - 05:59): transizione rosata/pesca delicata
  else {
    const factor = (p - 0.90) / 0.10;
    return { r: 230, g: 170, b: 140, a: 0.12 * (1 - factor), blend: 'source-over' };
  }
}

let currentWeather = 'clear'; // 'clear', 'rain', 'fog'
let weatherTimer = 0;
const rainDrops = [];
for (let i = 0; i < 45; i++) {
  rainDrops.push({
    x: Math.random() * VIEW_W,
    y: Math.random() * VIEW_H,
    len: 4 + Math.random() * 4,
    speed: 3 + Math.random() * 2
  });
}

function updateWeather(deltaTime) {
  weatherTimer += deltaTime;
  if (weatherTimer > 45) { // Cambia meteo ogni ~45 secondi di gioco
    weatherTimer = 0;
    const rnd = Math.random();
    if (rnd < 0.45) currentWeather = 'clear';
    else if (rnd < 0.75) currentWeather = 'rain';
    else currentWeather = 'fog';
    updateWeatherTag();
  }

  if (currentWeather === 'rain') {
    rainDrops.forEach(d => {
      d.y += d.speed;
      d.x -= 0.6;
      if (d.y > VIEW_H) { d.y = -6; d.x = Math.random() * (VIEW_W + 40); }
      if (d.x < -10) d.x = VIEW_W + 10;
    });
  }
}

function updateWeatherTag() {
  const t = I18N[currentLang].weather;
  weatherTag.innerText = t[currentWeather];
}

// Generazione Mappa
const worldMap = new Uint8Array(MAP_COLS * MAP_ROWS);
const T_GRASS = 0, T_MUD = 1, T_WATER = 2, T_ROAD = 3, T_WOODFLOOR = 4;

function generateWorld() {
  for (let r = 0; r < MAP_ROWS; r++) {
    for (let c = 0; c < MAP_COLS; c++) {
      let idx = r * MAP_COLS + c;
      if (c >= 38 + Math.floor(Math.sin(r * 0.3) * 3)) {
        worldMap[idx] = T_WATER;
      } else if (r >= 18 && r <= 21) {
        worldMap[idx] = T_ROAD;
      } else if (c >= 12 && c <= 14 && r <= 18 && r >= 6) {
        worldMap[idx] = T_ROAD;
      } else if (c >= 26 && c <= 28 && r >= 21 && r <= 34) {
        worldMap[idx] = T_MUD;
      } else if (c >= 8 && c <= 18 && r >= 2 && r <= 6) {
        worldMap[idx] = T_WOODFLOOR;
      } else {
        worldMap[idx] = (Math.sin(c * 0.4) * Math.cos(r * 0.4) > 0.4) ? T_MUD : T_GRASS;
      }
    }
  }
}

    btnTitleContinue.disabled = true;
  }
}

function autoSaveGame() {
  if (isTitleActive) return;
  const state = {
    x: Math.round(player.x),
    y: Math.round(player.y),
    dir: player.dir,
    worldTimeSeconds: worldTimeSeconds,
    currentWeather: currentWeather,
    collectedClues: Array.from(collectedClues),
    lang: currentLang
  };
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    showAutosaveFlash();
    checkExistingSave();
  } catch(e) {}
}

function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    player.x = data.x || 220;
    player.y = data.y || 310;
    player.dir = data.dir || 'down';
    worldTimeSeconds = data.worldTimeSeconds || 60;
    currentWeather = data.currentWeather || 'clear';
    collectedClues = new Set(data.collectedClues || []);
    if (data.lang) setLanguage(data.lang);
    cluesCounter.innerText = I18N[currentLang].cluesHud.replace('{0}', collectedClues.size);
    updateWeatherTag();
    return true;
  } catch(e) {
    return false;
  }
}

function resetGameProgress() {
  player.x = 220;
  player.y = 310;
  player.dir = 'down';
  worldTimeSeconds = 60;
  currentWeather = 'clear';
  collectedClues.clear();
  cluesCounter.innerText = I18N[currentLang].cluesHud.replace('{0}', 0);
  autoSaveGame();
}

let saveFlashTimer = null;

  autosaveIndicator.style.opacity = '1';
  clearTimeout(saveFlashTimer);
  saveFlashTimer = setTimeout(() => {

  }, 1400);
}

function bindTouch(id, k) {
  const el = document.getElementById(id);
  if (!el) return;
  const start = (e) => { e.preventDefault(); initAudio(); keys[k] = true; el.classList.add('pressed'); };
  const end = (e) => { e.preventDefault(); keys[k] = false; el.classList.remove('pressed'); };
  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}

// -------------------------------------------------------------
function handleActionButton() {
  if (isTitleActive || isGamePaused) return;

  if (isDialogueOpen) {
    nextDialogue();
    return;
  }

  const pBox = { x: player.x, y: player.y, w: player.w, h: player.h };

  // 1. NPC
  for (let npc of npcs) {
    if (getDistance(pBox, npc) < 26) {
      let lines = npc.dialogues[currentLang];
      let speech = lines[npc.dialogueIndex % lines.length];
      npc.dialogueIndex++;

      if (npc.id === 'deputy') unlockClue('deputy_statement');
      if (npc.id === 'fisherman') unlockClue('fisherman_rumor');

      startDialogue(npc.name, npc.role[currentLang], [speech]);
      return;
    }
  }

  // 2. Hotspot
  for (let spot of hotspots) {
    if (getDistance(pBox, spot) < 28) {
      unlockClue(spot.clueId);
      const cData = cluesDatabase.find(c => c.id === spot.clueId);
      startDialogue(spot.speaker[currentLang], spot.label[currentLang], [cData.text[currentLang]]);
      return;
    }
  }

  // 3. Edifici
  for (let b of buildings) {
    let door = { x: b.doorX, y: b.doorY, w: 16, h: 16 };
    if (getDistance(pBox, door) < 24) {
      const bName = currentLang === 'en' ? b.name : b.nameIt;
      startDialogue("DET. HAYES", "INSPECTION", [
        I18N[currentLang].inspectDoor.replace('{0}', bName)
      ]);
      return;
    }
  }

  // 4. Pensiero del Detective
  const def = I18N[currentLang].defaultThought;
  startDialogue(def.speaker, def.role, [def.text]);
}

function unlockClue(id) {
  if (!collectedClues.has(id)) {
    collectedClues.add(id);
    cluesCounter.innerText = I18N[currentLang].cluesHud.replace('{0}', collectedClues.size);
    autoSaveGame();
  }
}

function openJournal() {
  if (isTitleActive || isGamePaused) return;
  if (isDialogueOpen) {
    closeDialogue();
    return;
  }

  if (collectedClues.size === 0) {
    const empty = I18N[currentLang].emptyJournal;
    startDialogue(empty.title, empty.sub, [empty.text]);
    return;
  }

  let text = I18N[currentLang].journalHeader.replace('{0}', collectedClues.size);
  cluesDatabase.forEach(c => {
    if (collectedClues.has(c.id)) {
      text += `[X] ${c.title[currentLang].toUpperCase()}\n${c.zone[currentLang]}\n${c.text[currentLang]}\n\n`;
    }
  });

  startDialogue("CASE FILE", "EVIDENCE", [text]);
}

function startDialogue(speaker, role, lines) {
  dialogueSpeaker.innerText = speaker;
  dialogueRole.innerText = role;
  currentDialogueQueue = lines;
  currentQueueIndex = 0;
  dialogueText.innerText = currentDialogueQueue[0];
  dialogueBox.style.display = 'block';
  isDialogueOpen = true;
}

function nextDialogue() {
  currentQueueIndex++;
  if (currentQueueIndex < currentDialogueQueue.length) {
    dialogueText.innerText = currentDialogueQueue[currentQueueIndex];
  } else {
    closeDialogue();
  }
}

function closeDialogue() {
  dialogueBox.style.display = 'none';
  isDialogueOpen = false;
  currentDialogueQueue = [];
}

function getDistance(a, b) {
  const ax = a.x + (a.w ? a.w / 2 : 0);
  const ay = a.y + (a.h ? a.h / 2 : 0);
  const bx = b.x + (b.w ? b.w / 2 : 0);
  const by = b.y + (b.h ? b.h / 2 : 0);
  return Math.hypot(ax - bx, ay - by);
}

// -------------------------------------------------------------
// UPDATE & RENDERING PRINCIPALE
// -------------------------------------------------------------
let lastTimestamp = performance.now();

function update(deltaTime) {
  // Il tempo avanza solo se stiamo giocando (non durante pause o schermata iniziale)
  if (!isTitleActive && !isGamePaused) {
    updateDayNightCycle(deltaTime);
    updateWeather(deltaTime);
  }

  if (isTitleActive || isDialogueOpen || isGamePaused) return;

  let dx = 0;
  let dy = 0;

  if (keys.up)    { dy -= player.speed; player.dir = 'up'; }
  if (keys.down)  { dy += player.speed; player.dir = 'down'; }
  if (keys.left)  { dx -= player.speed; player.dir = 'left'; }
  if (keys.right) { dx += player.speed; player.dir = 'right'; }

  player.isMoving = (dx !== 0 || dy !== 0);

  if (dx !== 0 && dy !== 0) {
    dx *= 0.7071;
    dy *= 0.7071;
  }

  let nextX = player.x + dx;
  let nextY = player.y + dy;

  if (nextX < 8) nextX = 8;
  if (nextX > WORLD_W - player.w - 8) nextX = WORLD_W - player.w - 8;
  if (nextY < 8) nextY = 8;
  if (nextY > WORLD_H - player.h - 8) nextY = WORLD_H - player.h - 8;

  // Collisioni Edifici
  let collidesBuilding = false;
  for (let b of buildings) {
    if (nextX < b.x + b.w && nextX + player.w > b.x &&
        nextY < b.y + b.h && nextY + player.h > b.y) {
      collidesBuilding = true;
      break;
    }
  }

  // Acqua
  let tileCol = Math.floor((nextX + player.w / 2) / TILE_SIZE);
  let tileRow = Math.floor((nextY + player.h) / TILE_SIZE);
  let isWater = (worldMap[tileRow * MAP_COLS + tileCol] === T_WATER);

  // Auto Polizia
  let collidesCar = (nextX < policeCar.x + policeCar.w && nextX + player.w > policeCar.x &&
                     nextY < policeCar.y + policeCar.h && nextY + player.h > policeCar.y);

  if (!collidesBuilding && !isWater && !collidesCar) {
    player.x = nextX;
    player.y = nextY;
  }

  if (player.isMoving) player.animTick += 0.2;

  camera.update();

  animals.forEach(a => {
    if (a.type === 'alligator') {
      a.y += Math.sin(player.animTick * 0.4) * 0.2;
      a.x += a.dir * 0.15;
      if (a.x > WORLD_W - 20) a.dir = -1;
      if (a.x < 38 * TILE_SIZE) a.dir = 1;
    }
  });

  updateZoneTitle();
}

function updateZoneTitle() {
  const z = I18N[currentLang].zones;
  if (player.y > 450 && player.x > 320) {
    zoneTitle.innerText = z.glade;
  } else if (player.y < 160 && player.x < 320) {
    zoneTitle.innerText = z.church;
  } else if (player.x > 500) {
    zoneTitle.innerText = z.canal;
  } else if (player.y >= 260 && player.y <= 360) {
    zoneTitle.innerText = z.road;
  } else {
    zoneTitle.innerText = z.reeds;
  }
}

// -------------------------------------------------------------
// RENDERING MINI MAPPA IN STILE GTA
// -------------------------------------------------------------
function renderGtaMiniMap() {
  const mw = minimapCanvas.width;
  const mh = minimapCanvas.height;

  miniCtx.save();
  // Crea maschera circolare radar GTA
  miniCtx.beginPath();
  miniCtx.arc(mw / 2, mh / 2, mw / 2 - 1, 0, Math.PI * 2);
  miniCtx.clip();

  // Sfondo scuro radar
  miniCtx.fillStyle = '#102217';
  miniCtx.fillRect(0, 0, mw, mh);

  // Scala mappa: visualizza l'area intorno al detective
  const radarScale = 0.16;
  const radarCenterX = mw / 2;
  const radarCenterY = mh / 2;

  miniCtx.save();
  miniCtx.translate(radarCenterX, radarCenterY);

  // Disegna elementi ambientali nella mini mappa
  // 1. Acqua (a est)
  const waterScreenX = (38 * TILE_SIZE - player.x) * radarScale;
  miniCtx.fillStyle = '#2a6a7a';
  miniCtx.fillRect(waterScreenX, -mh, mw, mh * 2);

  // 2. Strade principali
  miniCtx.fillStyle = '#c7ab7c';
  // Statale orizzontale
  const roadY = (19 * TILE_SIZE - player.y) * radarScale;
  miniCtx.fillRect(-mw, roadY, mw * 2, 4 * TILE_SIZE * radarScale);
  // Raccordo verticale verso la chiesa
  const roadX = (13 * TILE_SIZE - player.x) * radarScale;
  const roadChurchY = (6 * TILE_SIZE - player.y) * radarScale;
  miniCtx.fillRect(roadX, roadChurchY, 3 * TILE_SIZE * radarScale, (19 - 6) * TILE_SIZE * radarScale);

  // 3. Edifici (Rettangoli scuri definiti)
  miniCtx.fillStyle = '#3a2d24';
  buildings.forEach(b => {
    const bx = (b.x - player.x) * radarScale;
    const by = (b.y - player.y) * radarScale;
    miniCtx.fillRect(bx, by, b.w * radarScale, b.h * radarScale);
  });

  // 4. Blip Obiettivi / Indizi (punti gialli pulsanti come in GTA)
  const blipAlpha = 0.6 + Math.sin(performance.now() * 0.006) * 0.4;
  hotspots.forEach(spot => {
    if (!collectedClues.has(spot.clueId)) {
      const sx = (spot.x - player.x) * radarScale;
      const sy = (spot.y - player.y) * radarScale;
      miniCtx.fillStyle = `rgba(245, 196, 66, ${blipAlpha})`;
      miniCtx.beginPath();
      miniCtx.arc(sx, sy, 2, 0, Math.PI * 2);
      miniCtx.fill();
    }
  });

  // 5. Blip NPC (punti azzurri)
  npcs.forEach(n => {
    const nx = (n.x - player.x) * radarScale;
    const ny = (n.y - player.y) * radarScale;
    miniCtx.fillStyle = '#55c0e8';
    miniCtx.fillRect(nx - 1, ny - 1, 2.5, 2.5);
  });

  miniCtx.restore();

  // 6. Blip Detective centrale (freccia direzionale stile GPS / GTA)
  miniCtx.save();
  miniCtx.translate(radarCenterX, radarCenterY);

  let angle = 0;
  if (player.dir === 'up') angle = -Math.PI / 2;
  else if (player.dir === 'down') angle = Math.PI / 2;
  else if (player.dir === 'left') angle = Math.PI;
  else if (player.dir === 'right') angle = 0;

  miniCtx.rotate(angle);
  miniCtx.fillStyle = '#ffffff';
  miniCtx.beginPath();
  miniCtx.moveTo(4, 0);
  miniCtx.lineTo(-3, -3);
  miniCtx.lineTo(-1, 0);
  miniCtx.lineTo(-3, 3);
  miniCtx.closePath();
  miniCtx.fill();

  miniCtx.restore();

  // Bordo metallico scanalato radar
  miniCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  miniCtx.lineWidth = 1;
  miniCtx.stroke();

  miniCtx.restore();
}

function draw() {
  ctx.save();
  ctx.translate(-Math.floor(camera.x), -Math.floor(camera.y));

  // Terreno
  let startCol = Math.floor(camera.x / TILE_SIZE);
  let endCol = Math.min(MAP_COLS, startCol + Math.ceil(VIEW_W / TILE_SIZE) + 2);
  let startRow = Math.floor(camera.y / TILE_SIZE);
  let endRow = Math.min(MAP_ROWS, startRow + Math.ceil(VIEW_H / TILE_SIZE) + 2);

  for (let r = startRow; r < endRow; r++) {
    for (let c = startCol; c < endCol; c++) {
      let t = worldMap[r * MAP_COLS + c];
      let px = c * TILE_SIZE;
      let py = r * TILE_SIZE;

      if (t === T_GRASS) {
        ctx.fillStyle = PAL.grassVibrant;
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
        if ((c + r) % 3 === 0) {
          ctx.fillStyle = PAL.grassLush;
          ctx.fillRect(px + 4, py + 4, 3, 3);
        }
      } else if (t === T_MUD) {
        ctx.fillStyle = PAL.mudPath;
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
      } else if (t === T_ROAD) {
        ctx.fillStyle = PAL.dirtRoad;
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = PAL.dirtTrack;
        ctx.fillRect(px, py + 3, TILE_SIZE, 2);
        ctx.fillRect(px, py + 11, TILE_SIZE, 2);
      } else if (t === T_WATER) {
        ctx.fillStyle = PAL.waterDeep;
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
        if (Math.sin((px + py + player.animTick * 6) * 0.2) > 0.3) {
          ctx.fillStyle = PAL.waterShallow;
          ctx.fillRect(px + 2, py + 6, 8, 1.5);
        }
      } else if (t === T_WOODFLOOR) {
        ctx.fillStyle = PAL.woodMid;
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
      }
    }
  }

  // Pontile e Barche
  ctx.fillStyle = PAL.woodLight;
  ctx.fillRect(35 * TILE_SIZE, 17 * TILE_SIZE, 5 * TILE_SIZE, 6);
  ctx.fillStyle = '#4a3729';
  ctx.fillRect(38 * TILE_SIZE, 19 * TILE_SIZE, 18, 8);

  // Edifici
  buildings.forEach(b => {
    ctx.fillStyle = PAL.woodDark;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = b.roofColor;
    ctx.fillRect(b.x - 2, b.y - 3, b.w + 4, 8);
    ctx.fillStyle = '#0f1412';
    ctx.fillRect(b.doorX - 2, b.doorY - 6, 12, 14);

    // Finestra illuminata
    ctx.fillStyle = '#ffcf52';
    ctx.fillRect(b.x + 10, b.y + 14, 4, 4);

    if (b.name.includes("Church")) {
      ctx.fillStyle = '#b2bcc0';
      ctx.fillRect(b.x + b.w / 2 - 1, b.y - 10, 3, 9);
      ctx.fillRect(b.x + b.w / 2 - 4, b.y - 7, 9, 2);
    }
  });

  // Auto Pattuglia
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(policeCar.x + 2, policeCar.y + 14, 32, 6);
  ctx.fillStyle = PAL.policeBlue;
  ctx.fillRect(policeCar.x, policeCar.y + 4, 36, 12);
  ctx.fillStyle = '#f3f6fa';
  ctx.fillRect(policeCar.x + 8, policeCar.y + 4, 18, 12);
  let flash = Math.floor(player.animTick * 3) % 2 === 0;
  ctx.fillStyle = flash ? '#e63939' : '#2b78e4';
  ctx.fillRect(policeCar.x + 16, policeCar.y - 2, 4, 3);

  // Alberi
  trees.forEach(t => {
    ctx.fillStyle = '#38281d';
    ctx.fillRect(t.x + t.size / 2 - 3, t.y + t.size * 0.4, 6, t.size * 0.6);
    ctx.fillStyle = '#2d4d30';
    ctx.beginPath();
    ctx.arc(t.x + t.size / 2, t.y + t.size * 0.35, t.size * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#617a66';
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(t.x + (t.size * 0.25) + i * 5, t.y + t.size * 0.45, 2, 7);
    }
  });

  // Scena del Delitto / Hotspots
  let treeSpot = hotspots[0];
  ctx.fillStyle = PAL.bloodDark;
  ctx.fillRect(treeSpot.x + 4, treeSpot.y + 12, 14, 4);
  ctx.fillStyle = PAL.corpsePale;
  ctx.fillRect(treeSpot.x + 8, treeSpot.y + 4, 6, 12);
  ctx.fillStyle = '#4f4330';
  ctx.fillRect(treeSpot.x + 6, treeSpot.y, 2, 4);
  ctx.fillRect(treeSpot.x + 12, treeSpot.y, 2, 4);
  ctx.fillStyle = PAL.goldSymbol;
  ctx.fillRect(treeSpot.x + 10, treeSpot.y + 7, 3, 3);

  // Totem di rami (Devil's Nests)
  let nestSpot = hotspots[1];
  ctx.fillStyle = '#8f724d';
  ctx.fillRect(nestSpot.x + 6, nestSpot.y + 6, 6, 6);
  ctx.fillStyle = '#e8d5b5';
  ctx.fillRect(nestSpot.x + 8, nestSpot.y + 8, 2, 2);

  // Animali
  animals.forEach(a => {
    if (a.type === 'alligator') {
      ctx.fillStyle = '#263a2b';
      ctx.fillRect(a.x, a.y, 16, 5);
      ctx.fillStyle = '#e64233';
      ctx.fillRect(a.x + (a.dir > 0 ? 13 : 0), a.y, 2, 2);
    } else {
      ctx.fillStyle = '#111818';
      ctx.fillRect(a.x, a.y, 4, 4);
    }
  });

  // NPC
  npcs.forEach(npc => {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(npc.x + 2, npc.y + 13, 8, 3);
    if (npc.id === 'deputy') {
      ctx.fillStyle = '#6e583f';
      ctx.fillRect(npc.x + 2, npc.y + 4, 8, 8);
      ctx.fillStyle = '#9e8465';
      ctx.fillRect(npc.x + 1, npc.y, 10, 2);
    } else if (npc.id === 'preacher') {
      ctx.fillStyle = '#15191c';
      ctx.fillRect(npc.x + 2, npc.y + 3, 8, 11);
      ctx.fillStyle = '#e2e7ec';
      ctx.fillRect(npc.x + 5, npc.y + 6, 2, 3);
    } else {
      ctx.fillStyle = '#cca32f';
      ctx.fillRect(npc.x + 2, npc.y + 4, 8, 9);
    }
    ctx.fillStyle = PAL.skin;
    ctx.fillRect(npc.x + 4, npc.y + 2, 4, 2);
  });

  // Detective Rust Hayes
  const bob = player.isMoving ? Math.sin(player.animTick) * 1 : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(player.x + 2, player.y + 13, 8, 3);
  ctx.fillStyle = '#1b2126';
  ctx.fillRect(player.x + 3, player.y + 9, 2, 5);
  ctx.fillRect(player.x + 7, player.y + 9, 2, 5);
  ctx.fillStyle = PAL.coatBrown;
  ctx.fillRect(player.x + 2, player.y + 4 + bob, 8, 7);
  ctx.fillStyle = '#f5f2e6';
  ctx.fillRect(player.x + 5, player.y + 4 + bob, 2, 3);
  ctx.fillStyle = PAL.skin;
  ctx.fillRect(player.x + 4, player.y + 1 + bob, 4, 3);
  ctx.fillStyle = '#2c221a';
  ctx.fillRect(player.x + 3, player.y + bob, 6, 2);

  // Icona esclamativa interazione
  checkInteractionPrompt();

  ctx.restore();

  // Filtro Atmosferico & Meteo Dinamico
  drawAtmosphereAndWeather();

  // Render Mini Mappa
  renderGtaMiniMap();
}

function checkInteractionPrompt() {
  const pBox = { x: player.x, y: player.y, w: player.w, h: player.h };
  let canInteract = npcs.some(n => getDistance(pBox, n) < 26) ||
                    hotspots.some(s => getDistance(pBox, s) < 28) ||
                    buildings.some(b => getDistance(pBox, { x: b.doorX, y: b.doorY, w: 16, h: 16 }) < 24);

  if (canInteract) {
    ctx.fillStyle = '#f7ce46';
    ctx.fillRect(player.x + 5, player.y - 8, 3, 5);
    ctx.fillRect(player.x + 5, player.y - 2, 3, 2);
  }
}

function drawAtmosphereAndWeather() {
  // 1. Tono di luce giorno/notte (chiaro e visibile, niente buio nero o cerchio faretto)
  const amb = getDayNightAmbientColor();
  if (amb.a > 0) {
    ctx.save();
    ctx.fillStyle = `rgba(${amb.r}, ${amb.g}, ${amb.b}, ${amb.a})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.restore();
  }

  // 2. Meteo Dinamico: Nebbia o Pioggia
  if (currentWeather === 'fog') {
    ctx.fillStyle = 'rgba(215, 230, 225, 0.22)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    // Banchi di nebbia galleggianti
    ctx.fillStyle = 'rgba(235, 245, 240, 0.12)';
    for (let i = 0; i < 3; i++) {
      const fogY = 20 + i * 42 + Math.sin(player.animTick * 0.2 + i) * 6;
      ctx.fillRect(0, fogY, VIEW_W, 14);
    }
  } else if (currentWeather === 'rain') {
    ctx.fillStyle = 'rgba(175, 210, 230, 0.65)';
    rainDrops.forEach(d => {
      ctx.fillRect(d.x, d.y, 1, d.len);
    });
  }

  // 3. Scanlines CRT retrò delicate (leggere per mantenere nitidezza)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  for (let y = 0; y < VIEW_H; y += 2) {
    ctx.fillRect(0, y, VIEW_W, 1);
  }
}

// -------------------------------------------------------------
// GAME LOOP
// -------------------------------------------------------------
function gameLoop(currentTimestamp) {
  const deltaTime = (currentTimestamp - lastTimestamp) / 1000;
  lastTimestamp = currentTimestamp;

  update(deltaTime);
  draw();
  requestAnimationFrame(gameLoop);
}

// Avvio
setLanguage('en');
checkExistingSave();

requestAnimationFrame((ts) => {
  lastTimestamp = ts;
  requestAnimationFrame(gameLoop);
});
</script>
